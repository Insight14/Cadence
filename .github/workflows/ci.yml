name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting and lint with ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Typecheck with mypy
        run: |
          mypy src tests

      - name: Run tests with pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/jobpilot_test
          DATABASE_SYNC_URL: postgresql://postgres:postgres@localhost:5432/jobpilot_test
          FERNET_KEY: wU918b0Bq_PsA5XEnvI6FmqVGRqZRXl5r42SyTjkpT4=
          TELEGRAM_BOT_TOKEN: 1234567890:mock_telegram_bot_token_for_ci_test
          GOOGLE_CLIENT_ID: mock-client-id
          GOOGLE_CLIENT_SECRET: mock-client-secret
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: mock-gemini-api-key
          ANTHROPIC_API_KEY: sk-ant-mock-key
        run: |
          pytest
