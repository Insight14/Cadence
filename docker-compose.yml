services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobpilot-api
    restart: unless-stopped
    command: uvicorn jobpilot.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/jobpilot
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/jobpilot
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobpilot-worker
    restart: unless-stopped
    command: python -m jobpilot.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/jobpilot
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/jobpilot
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
