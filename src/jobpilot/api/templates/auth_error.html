<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connection Failed - JobPilot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; text-align: center; max-width: 480px; border: 1px solid #ef4444; }
        h1 { color: #f87171; margin-bottom: 0.5rem; }
        p { color: #94a3b8; line-height: 1.6; }
        .btn { display: inline-block; background: #38bdf8; color: #0f172a; text-decoration: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>OAuth Error</h1>
        <p>Failed to complete Google authentication: {{ error }}</p>
        <a href="/auth/google/start" class="btn">Try Again</a>
    </div>
</body>
</html>
