<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Account Connected - JobPilot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 480px; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; }
        p { color: #94a3b8; line-height: 1.6; }
        .badge { background: #0369a1; color: #e0f2fe; padding: 0.35rem 0.8rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; display: inline-block; margin: 1rem 0; }
        .btn { display: inline-block; background: #38bdf8; color: #0f172a; text-decoration: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; margin-top: 1rem; transition: background 0.2s; }
        .btn:hover { background: #7dd3fc; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Gmail Connected!</h1>
        <span class="badge">{{ google_email }}</span>
        <p>JobPilot is now securely monitoring your inbox for Online Assessments and interview invitations in read-only mode.</p>
        <p><strong>User ID:</strong> <code>{{ user_id }}</code></p>
        <a href="/" class="btn">Return to Dashboard</a>
    </div>
</body>
</html>
